schema: spec-driven

# Este bloque se le inyecta a la IA al crear artefactos. Es el UNICO lugar
# donde existen nombres de libreria: los specs en `specs/` son neutrales de
# stack a proposito.
context: |
  QUE ES
    Un harness de coding agent: el programa que le da a un LLM las capacidades
    que el modelo no tiene. Lee archivos, ejecuta herramientas, gestiona el
    contexto y se cancela a mitad de tarea.
    El modelo es el motor. El harness es el chasis.

  ALCANCE IMPLEMENTADO: niveles 0 al 8
    0  One-shot. Una llamada al provider. Descarta problemas falsos.
    1  El loop y las herramientas.
    2  Gestion de contexto: presupuesto, recorte, compactacion.
    3  Subagentes con contexto aislado y tareas en background.
    6  Contexto fino en 5 etapas (aviso, enmascarar, podar, resumir, compactar).
    7  Permisos declarativos, aprobaciones obligatorias y hooks de ciclo de vida.
    8  Instrucciones del proyecto (AGENTS.md raiz + anidados) y skills bajo demanda.
    Ademas: agentes primarios, tandas paralelas, persistencia de sesiones y ramas.
    Fuera de alcance: sandbox, LSP, MCP, memoria persistente entre sesiones.
    La escalera completa esta documentada en `alcance/`, que es referencia de
    razonamiento y no contrato. El contrato vive en `openspec/specs/`.

  STACK DECIDIDO
    Node 24, ESM, TypeScript strict con `noUncheckedIndexedAccess`.
    Ink 7.1.1 con React 19 para la interfaz de terminal.
    Biome para lint y formato. Vitest para pruebas.
    Sin base de datos en ningun nivel. El estado vive en memoria durante el
    turno; la persistencia es JSONL en `.harness/`.

  PLATAFORMAS: Linux, macOS y Windows
    Las tres se prueban en CI. En Windows la interfaz degrada a salida linea a
    linea cuando no hay terminal interactiva, porque Ink tiene fallos de render
    especificos de esa consola.

  LOS SPECS SON NEUTRALES DE STACK A PROPOSITO
    No mencionan lenguajes, frameworks, nombres de archivo ni tablas. El stack
    vive unicamente aqui. La regla: si un requisito necesita nombrar una
    libreria o un algoritmo, esta mal escrito.

  CONVENCIONES DE LOS SPECS
    Carpetas en ingles: core, provider, tools, context, interface, sesiones,
    agents, subagents, permissions, instructions, skills, hooks.
    Texto de los requisitos en espanol. Los marcadores estructurales van en
    ingles porque el CLI los parsea: `## Purpose`, `## Requirements`,
    `### Requirement:`, `#### Scenario:`. Las palabras clave tambien:
    SHALL, MUST, WHEN, THEN, AND.
    Cada requisito SHALL contener SHALL o MUST, y SHALL tener al menos un
    escenario con cuerpo. Un escenario sin cuerpo bajo su encabezado no cuenta.

  CATALOGO Y LISTA NEGRA DE COMANDOS
    La herramienta de ejecucion corre contra el catalogo de la plataforma activa,
    y cada plataforma declara el suyo.

    El catalogo y la lista negra son etiquetas de riesgo, NO un muro. Nada se
    rechaza: un comando fuera del catalogo, un comando de la lista negra, una
    redireccion, un heredoc o una sustitucion de comandos piden aprobacion
    OBLIGATORIA. La persona decide. Solo una regla `denegar` configurada impide la
    ejecucion; ninguna regla `permitir` ni aprobacion guardada salta la aprobacion
    obligatoria. Sin terminal interactiva se deniega: no hay a quien preguntar.

    La lista negra se evalua por el NOMBRE COMPLETO del comando, nunca por
    combinaciones de flags. Una cadena como `rm -rf` es evadible: `rm -fr`,
    `rm -r -f`, `rm -f -r` y `rm --recursive --force` producen el mismo borrado.
    Verificado en GNU coreutils 9.7.

    WINDOWS USA POWERSHELL. No hay lista negra en Windows: borrar tiene nueve
    alias distintos (del, erase, rd, ri, rm, rmdir, rni, rmir, rp) y ademas se
    puede llamar como metodo .NET. El catalogo es explicito y la composicion pide
    aprobacion obligatoria.

    UNIX, lista negra: rm, rmdir, unlink, shred, mkfs, dd, chmod, chown, chgrp,
    sudo, su, doas, mount, umount, kill, killall, pkill, shutdown, reboot, halt,
    poweroff.

    `write` sigue disponible en la v1: el agente puede sobrescribir un archivo del
    proyecto. Es una decision consciente, no un descuido.

  LOS TRES PARAMETROS
    Limite de pasos: 25 por defecto, configurable.
    Presupuesto de contexto: 80% de la ventana del modelo, configurable.
    Truncado del contenido de una herramienta: 30.000 caracteres, configurable.
    Los tres son pernos de ajuste, no reglas de negocio: cambiarlos no obliga a
    editar el spec.

  FLUJO DE ESTE REPO
    `openspec/specs/` es el contrato acordado: 12 capacidades, 138 requisitos y
    456 escenarios. Los 31 changes de `openspec/changes/archive/` ya lo implementaron.
    Los changes IMPLEMENTAN contra esos requisitos, no los vuelven a derivar. Al
    proponer un change, leer primero la capacidad con
    `openspec show <cap> --type spec` y citar sus requisitos por nombre.

  ESTADO
    12 capacidades, 138 requisitos, 456 escenarios. Todo validado contra el schema
    `spec-driven`.
    core (12) · provider (8) · tools (21) · context (14) · interface (22) · sesiones (11) · agents (6) · subagents (15) · permissions (9) · instructions (8) · skills (6) · hooks (6)
    IMPLEMENTADO: `src/` y `tests/` existen, `npm run check` pasa con 462 tests
    y `npm run build` genera `dist/main.js`. La prueba de punta a punta contra
    OpenRouter paso en modo plano, con lectura real de archivos y cambio de
    modelo por `--modelo`.

    El provider concreto es OpenRouter por su API compatible con OpenAI; Ollama
    queda como alternativa local. La credencial se lee desde `.env` mediante
    `variableApiKey`, y `.harness/config.json` del proyecto se versiona sin secretos.
    La interfaz sigue siendo agnostica: el adaptador vive en `src/provider/adapters/`
    y el nucleo no lo importa.

    Reintentos: 3 intentos como maximo, espera inicial de 500 ms y factor 2
    (`src/provider/retry.ts`); el spec acota el numero sin fijar la cifra. La v1
    no tiene motor de busqueda de subagentes: se eligen por nombre entre los
    declarados.
